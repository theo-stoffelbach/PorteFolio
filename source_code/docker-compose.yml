services:
  portfolio:
    image: ghcr.io/theo-stoffelbach/portefolio:latest
    container_name: portfolio
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ../.env.runtime
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------------------------
  # WATCHTOWER LOCAL SUPPRIMÉ - aucun docker.sock dans cette stack
  # --------------------------------------------------------------------------
  # Le label du service délègue les mises à jour au Watchtower centralisé,
  # qui accède à Docker uniquement via le socket proxy sécurisé du NAS.
  # --------------------------------------------------------------------------

networks:
  public:
    external: true
    name: portfolio_public
