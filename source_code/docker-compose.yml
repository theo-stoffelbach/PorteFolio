services:
  portfolio:
    image: ghcr.io/theo-stoffelbach/portefolio:latest
    container_name: portfolio
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ../.env.runtime
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------------------------
  # WATCHTOWER SUPPRIMÉ - Vulnérabilité critique (docker.sock exposé)
  # --------------------------------------------------------------------------
  # Alternative pour mettre à jour :
  #   1. Manuellement : docker pull ghcr.io/theo-stoffelbach/portefolio:v1.0.0
  #   2. Cron sur l'hôte : 0 4 * * * docker pull ... && docker-compose up -d
  #   3. Ou utiliser un registry webhook
  # --------------------------------------------------------------------------

networks:
  public:
    external: true
    name: portfolio_public
