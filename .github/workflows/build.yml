name: Build & Push to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Lint, TypeCheck & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Block critical vulnerabilities in the full dependency tree
        run: npm audit --audit-level=critical
      - run: npm run build

  test-source-code:
    name: 🧪 source_code Lint, TypeCheck & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source_code
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source_code/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Block critical vulnerabilities in the full dependency tree
        run: npm audit --audit-level=critical
      - run: npm run build

  validate-docker:
    name: 🐳 Build Docker (${{ matrix.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test
      - test-source-code
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        context:
          - .
          - ./source_code
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false

  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test
      - test-source-code
    if: github.event_name == 'push' && success()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portefolio:latest
            ghcr.io/${{ github.repository_owner }}/portefolio:${{ github.sha }}
