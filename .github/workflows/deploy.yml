name: Deploy to Production

on:
  push:
    branches:
      - main
      - V3_PorteFolio
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to NAS
    runs-on: [self-hosted, nas, portfolio]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy locally on NAS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "Portfolio - Deployment Started"
          echo "=========================================="
          echo "Date: $(date)"
          echo ""

          # Fix git ownership issue
          git config --global --add safe.directory /volume2/docker/portefolio

          cd /volume2/docker/portefolio

          # Configure git credentials
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          echo "Pulling latest changes..."
          git fetch origin
          git checkout main || git checkout V3_PorteFolio
          git pull
          echo ""

          echo "Building and restarting containers..."
          docker compose down
          docker compose build --no-cache
          docker compose up -d
          echo ""

          echo "=========================================="
          echo "Deployment completed!"
          echo "=========================================="

      - name: Health check
        run: |
          echo "Waiting for container to be healthy (30s)..."
          sleep 30
          echo ""
          echo "Container status:"
          docker ps --filter "name=portfolio" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
